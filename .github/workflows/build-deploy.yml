name: actions_test
on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
  # 公式 php:*-apache の更新 (セキュリティ修正版) を取り込むため週次でもリビルドする
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
jobs:
  DockerBuilding:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: check current dir
        run: |
          pwd

      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: p0x0q/laravel-quick-setup
          tags: |
            type=raw,value=php${{ matrix.php }}-apache

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show PHP version of the pushed image
        run: docker run --rm --pull always "p0x0q/laravel-quick-setup:php${{ matrix.php }}-apache" php -v
