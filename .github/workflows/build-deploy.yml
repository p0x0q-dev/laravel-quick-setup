name: actions_test
on:
  push:
    branches:
      - php8.3-apache
  pull_request:
    branches:
      - php8.3-apache
  workflow_dispatch:

jobs:
  DockerBuilding:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: p0x0q/laravel-quick-setup
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 公式 php イメージに修正版がまだ無ければ、docker-library/php の同じ Dockerfile からビルドする
      - name: Resolve PHP image
        id: php
        run: |
          set -euo pipefail
          . php/upstream.env
          official="php:${PHP_UPSTREAM_VERSION}-apache-bookworm"
          if docker manifest inspect "$official" >/dev/null 2>&1; then
            echo "image=$official" >> "$GITHUB_OUTPUT"; echo "pull=--pull" >> "$GITHUB_OUTPUT"
          else
            git clone -q https://github.com/docker-library/php.git "$RUNNER_TEMP/docker-library-php"
            git -C "$RUNNER_TEMP/docker-library-php" checkout -q "$PHP_UPSTREAM_REF"
            grep -qx "ENV PHP_VERSION ${PHP_UPSTREAM_VERSION}" "$RUNNER_TEMP/docker-library-php/8.3/bookworm/apache/Dockerfile"
            docker build --pull -t "local/php:${PHP_UPSTREAM_VERSION}-apache-bookworm" "$RUNNER_TEMP/docker-library-php/8.3/bookworm/apache"
            echo "image=local/php:${PHP_UPSTREAM_VERSION}-apache-bookworm" >> "$GITHUB_OUTPUT"; echo "pull=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${PHP_UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"

      # キャッシュで古い PHP を掴まない
      - name: Build base image
        run: docker build ${{ steps.php.outputs.pull }} --no-cache --build-arg PHP_IMAGE="${{ steps.php.outputs.image }}" -t "$IMAGE:ci" .

      - name: Verify base image
        id: base
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE:ci" php -v
          ver=$(docker run --rm "$IMAGE:ci" php -r 'echo PHP_VERSION;')
          [ "$ver" = "${{ steps.php.outputs.version }}" ] || { echo "unexpected PHP $ver"; exit 1; }
          docker run --rm "$IMAGE:ci" php -r '
            if (ini_get("session.upload_progress.enabled")) { fwrite(STDERR, "upload_progress is on\n"); exit(1); }
            if (!ini_get("session.use_strict_mode")) { fwrite(STDERR, "use_strict_mode is off\n"); exit(1); }'
          echo "php_version=$ver" >> "$GITHUB_OUTPUT"

      - name: Push base image
        if: env.PUSH == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.base.outputs.php_version }}"
          for t in php8.3-apache "php${ver}-apache"; do
            docker tag "$IMAGE:ci" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "base: $IMAGE:php${ver}-apache $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:php${ver}-apache")" >> "$GITHUB_STEP_SUMMARY"

      # aipco-next-container の緊急リベース (PHP2Shell)。詳細は aipco-rebase/Dockerfile。
      - name: Rebase aipco-next-container images
        run: |
          set -euo pipefail
          ver="${{ steps.base.outputs.php_version }}"
          jq -c '.[]' aipco-rebase/targets.json | while read -r t; do
            env=$(jq -r .env <<<"$t"); src=$(jq -r .source <<<"$t"); sha=$(jq -r .sha <<<"$t")
            dst="p0x0q/${env}-aipco-next-container:${sha}-php${ver}"
            docker build --pull=false \
              --build-arg BASE_IMAGE="$IMAGE:ci" --build-arg SOURCE_IMAGE="$src" \
              -t "$dst" aipco-rebase
            docker run --rm --entrypoint php "$dst" -v
            docker run --rm --entrypoint php "$dst" -r '
              if (PHP_VERSION !== $argv[1]) { fwrite(STDERR, "PHP ".PHP_VERSION."\n"); exit(1); }
              if (ini_get("session.upload_progress.enabled")) { fwrite(STDERR, "upload_progress is on\n"); exit(1); }
              if (!ini_get("session.use_strict_mode")) { fwrite(STDERR, "use_strict_mode is off\n"); exit(1); }
              foreach (["gmp","gd","intl","pdo_mysql","zip","bcmath"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing $e\n"); exit(1); } }
              require "/var/www/html/vendor/autoload.php";' "$ver"
            docker run --rm --entrypoint php "$dst" /var/www/html/artisan --version
            if [ "$PUSH" = "true" ]; then
              docker push "$dst"
              echo "${env}: $dst $(docker inspect --format '{{index .RepoDigests 0}}' "$dst")" >> "$GITHUB_STEP_SUMMARY"
            fi
            docker rmi -f "$dst" "$src" >/dev/null 2>&1 || true
            docker builder prune -af >/dev/null
          done
